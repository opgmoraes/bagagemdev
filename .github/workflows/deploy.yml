name: Deploy Bagagem Dev pro GitHub Pages

# Roda automaticamente toda vez que você faz push na branch main
on:
  push:
    branches: [main]
  workflow_dispatch: # também permite rodar manualmente pela aba Actions

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o código do repositório
        uses: actions/checkout@v4

      - name: Gerar firebase-config.js a partir dos Secrets
        # As chaves NUNCA ficam no repositório — são lidas dos GitHub Secrets
        # (Settings > Secrets and variables > Actions) só neste momento do deploy,
        # e o arquivo gerado só existe dentro do ambiente de build da Action.
        # Script com validação em scripts/build-firebase-config.js
        env:
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          FIREBASE_AUTH_DOMAIN: ${{ secrets.FIREBASE_AUTH_DOMAIN }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_STORAGE_BUCKET: ${{ secrets.FIREBASE_STORAGE_BUCKET }}
          FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
        run: node scripts/build-firebase-config.js

      - name: Remover .gitignore antes de publicar
        # O .gitignore protege firebase-config.js no repositório principal (correto,
        # continua assim). Mas a Action de publicação também usa Git por baixo dos
        # panos e respeitaria esse .gitignore, pulando o arquivo que acabamos de gerar
        # no passo anterior. Removendo o .gitignore só nesta cópia temporária que vai
        # pro GitHub Pages, o firebase-config.js gerado consegue ser publicado.
        run: rm -f .gitignore

      - name: Publicar no GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: .
